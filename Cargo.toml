[workspace]
resolver = "2"
members = [
    "crates/kicase-app",
    "crates/kicase-kicad",
    "crates/kicase-model",
    "crates/kicase-geometry",
    "crates/kicase-occ",
    "crates/kicase-truck",
    "crates/kicase-export",
    "crates/kicase-ui",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kicase/kicase"
authors = ["KiCase contributors"]

[workspace.dependencies]
kicase-geometry = { path = "crates/kicase-geometry", version = "0.1.0" }
kicase-model = { path = "crates/kicase-model", version = "0.1.0" }
kicase-kicad = { path = "crates/kicase-kicad", version = "0.1.0" }
kicase-occ = { path = "crates/kicase-occ", version = "0.1.0" }
kicase-export = { path = "crates/kicase-export", version = "0.1.0" }
kicase-ui = { path = "crates/kicase-ui", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
approx = "0.5"
